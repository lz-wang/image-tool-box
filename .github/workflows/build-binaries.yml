name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04

    env:
      ITB_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      ITB_TEST_MINIO_ACCESS_KEY: minioadmin
      ITB_TEST_MINIO_SECRET_KEY: minioadmin
      # strict 模式：MinIO 起不来时集成测试必须失败，不能悄悄 skip
      ITB_REQUIRE_MINIO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 不用 service container：GitHub Actions 的 services 不支持容器命令
      # （args 是非法键，会使整个 workflow 在解析阶段失败且不创建任何
      # job；options 又只能传 docker create 的 flags），而 minio/minio
      # 镜像的默认 CMD 只有 "minio"，必须显式传 server /data 才能启动。
      # 在 step 内 docker run 并等待健康检查，启动失败时本 step 直接红。
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-06-13T22-53-53Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready (probe $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO failed to become healthy"
          docker logs minio
          exit 1

      - name: Run unit checks
        run: |
          make check
          go test ./... -skip '^TestMinIO(Integration|CLIE2E)$' -covermode=atomic -coverprofile=coverage.out
          go test -race ./internal/compress ./internal/httpapi

      # MinIO 集成/E2E 先于 Codecov 执行：功能正确性验证绝不依赖
      # 第三方 coverage 服务的可用性。
      - name: Run MinIO domain integration tests
        run: go test ./internal/s3 -run '^TestMinIOIntegration$' -v

      - name: Run MinIO CLI end-to-end tests
        run: go test ./internal/s3 -run '^TestMinIOCLIE2E$' -v

      # Codecov 与功能正确性解耦：coverage 上传失败（受保护分支缺
      # CODECOV_TOKEN、第三方服务故障）只降级为警告，不得再阻断
      # 后续检查与构建矩阵。
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          name: backend
          fail_ci_if_error: false

  build:
    name: ${{ matrix.target.name }}
    needs: checks
    runs-on: ${{ matrix.target.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-amd64
            runs_on: macos-15-intel
            goos: darwin
            goarch: amd64
            bins_dir: bins/macos-amd64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - name: macos-arm64
            runs_on: macos-15
            goos: darwin
            goarch: arm64
            bins_dir: bins/macos-arm64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: linux-amd64
            runs_on: ubuntu-24.04
            goos: linux
            goarch: amd64
            bins_dir: bins/linux-amd64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: ""
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            bins_dir: bins/linux-arm64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: ""
          - name: windows-amd64
            runs_on: windows-2025
            goos: windows
            goarch: amd64
            bins_dir: bins/windows-amd64
            exe_suffix: .exe
            archive_ext: zip
            cmake_extra_args: ""
          - name: windows-arm64
            runs_on: windows-11-arm
            goos: windows
            goarch: arm64
            bins_dir: bins/windows-arm64
            exe_suffix: .exe
            archive_ext: zip
            cmake_extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve development version
        id: version
        shell: bash
        run: echo "version=dev-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build bundled compression binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build-linux-bins-container.sh "${{ matrix.target.goarch }}" "${{ matrix.target.bins_dir }}"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install nasm

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host "Using preinstalled CMake:"
            cmake --version
          } else {
            choco install -y cmake
          }

          if (Get-Command nasm -ErrorAction SilentlyContinue) {
            Write-Host "Using preinstalled NASM:"
            nasm -v
          } else {
            choco install -y nasm
          }

      - name: Build pngquant and oxipng (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ matrix.target.bins_dir }}"

          git clone --depth 1 --branch 3.0.3 --recursive https://github.com/kornelski/pngquant.git /tmp/pngquant
          pngquant_lock_flag=""
          if [[ -f /tmp/pngquant/Cargo.lock ]]; then
            pngquant_lock_flag="--locked"
          fi
          cargo build --manifest-path /tmp/pngquant/Cargo.toml --release ${pngquant_lock_flag}
          install -m 0755 /tmp/pngquant/target/release/pngquant "${{ matrix.target.bins_dir }}/pngquant"

          git clone --depth 1 --branch v10.1.0 https://github.com/oxipng/oxipng.git /tmp/oxipng
          oxipng_lock_flag=""
          if [[ -f /tmp/oxipng/Cargo.lock ]]; then
            oxipng_lock_flag="--locked"
          fi
          cargo build --manifest-path /tmp/oxipng/Cargo.toml --release ${oxipng_lock_flag}
          install -m 0755 /tmp/oxipng/target/release/oxipng "${{ matrix.target.bins_dir }}/oxipng"

      - name: Build pngquant and oxipng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          New-Item -ItemType Directory -Force -Path $binsDir | Out-Null

          $pngquantDir = Join-Path $env:RUNNER_TEMP "pngquant"
          if (Test-Path $pngquantDir) { Remove-Item -Recurse -Force $pngquantDir }
          git clone --depth 1 --branch 3.0.3 --recursive https://github.com/kornelski/pngquant.git $pngquantDir
          $pngquantArgs = @("build", "--manifest-path", (Join-Path $pngquantDir "Cargo.toml"), "--release")
          if (Test-Path (Join-Path $pngquantDir "Cargo.lock")) { $pngquantArgs += "--locked" }
          cargo @pngquantArgs
          Copy-Item (Join-Path $pngquantDir "target\release\pngquant.exe") (Join-Path $binsDir "pngquant.exe")

          $oxipngDir = Join-Path $env:RUNNER_TEMP "oxipng"
          if (Test-Path $oxipngDir) { Remove-Item -Recurse -Force $oxipngDir }
          git clone --depth 1 --branch v10.1.0 https://github.com/oxipng/oxipng.git $oxipngDir
          $oxipngArgs = @("build", "--manifest-path", (Join-Path $oxipngDir "Cargo.toml"), "--release")
          if (Test-Path (Join-Path $oxipngDir "Cargo.lock")) { $oxipngArgs += "--locked" }
          cargo @oxipngArgs
          Copy-Item (Join-Path $oxipngDir "target\release\oxipng.exe") (Join-Path $binsDir "oxipng.exe")

      - name: Build libjpeg-turbo static tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 3.1.3 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/libjpeg-turbo
          cmake -S /tmp/libjpeg-turbo -B /tmp/libjpeg-turbo/build \
            -DENABLE_SHARED=FALSE \
            -DENABLE_STATIC=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.target.cmake_extra_args }}
          cmake --build /tmp/libjpeg-turbo/build --parallel
          install -m 0755 /tmp/libjpeg-turbo/build/cjpeg-static "${{ matrix.target.bins_dir }}/cjpeg-static"
          install -m 0755 /tmp/libjpeg-turbo/build/djpeg-static "${{ matrix.target.bins_dir }}/djpeg-static"
      - name: Build libjpeg-turbo static tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          $libjpegDir = Join-Path $env:RUNNER_TEMP "libjpeg-turbo"
          $buildDir = Join-Path $libjpegDir "build"
          $cmakeArch = if ("${{ matrix.target.goarch }}" -eq "arm64") { "ARM64" } else { "x64" }

          if (Test-Path $libjpegDir) { Remove-Item -Recurse -Force $libjpegDir }
          git clone --depth 1 --branch 3.1.3 https://github.com/libjpeg-turbo/libjpeg-turbo.git $libjpegDir

          cmake -S $libjpegDir -B $buildDir -A $cmakeArch -DENABLE_SHARED=FALSE -DENABLE_STATIC=TRUE -DCMAKE_BUILD_TYPE=Release
          cmake --build $buildDir --config Release --parallel

          $candidates = @{
            "cjpeg-static.exe" = @(
              (Join-Path $buildDir "Release\cjpeg-static.exe"),
              (Join-Path $buildDir "cjpeg-static.exe")
            )
            "djpeg-static.exe" = @(
              (Join-Path $buildDir "Release\djpeg-static.exe"),
              (Join-Path $buildDir "djpeg-static.exe")
            )
          }

          foreach ($fileName in $candidates.Keys) {
            $source = $null
            foreach ($candidate in $candidates[$fileName]) {
              if (Test-Path $candidate) {
                $source = $candidate
                break
              }
            }

            if (-not $source) {
              throw "Expected libjpeg-turbo artifact not found: $fileName"
            }

            Copy-Item $source (Join-Path $binsDir $fileName)
          }

      - name: Verify required bundled binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          test -x "${{ matrix.target.bins_dir }}/pngquant"
          test -x "${{ matrix.target.bins_dir }}/oxipng"
          test -x "${{ matrix.target.bins_dir }}/cjpeg-static"
          test -x "${{ matrix.target.bins_dir }}/djpeg-static"

      - name: Verify required bundled binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          $required = @(
            "pngquant.exe",
            "oxipng.exe",
            "cjpeg-static.exe",
            "djpeg-static.exe"
          )

          foreach ($fileName in $required) {
            $path = Join-Path $binsDir $fileName
            if (-not (Test-Path $path)) {
              throw "Missing bundled binary: $path"
            }
          }

      - name: Verify Linux ABI contract
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-linux-abi.sh "${{ matrix.target.goarch }}" "${{ matrix.target.bins_dir }}"

      - name: Build itb (Unix)
        if: runner.os != 'Windows'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.target.name }}
          go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.target.name }}/itb .

      - name: Test filesystem contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./internal/imageio

      - name: Build itb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          $distDir = Join-Path "dist" "${{ matrix.target.name }}"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          go build -trimpath -ldflags "-s -w" -o (Join-Path $distDir "itb.exe") .

      - name: Verify Linux glibc 2.28 compression compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-linux-compress-e2e.sh "${{ matrix.target.goarch }}" "dist/${{ matrix.target.name }}/itb"

      - name: Verify Windows persistent compression cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workDir = Join-Path $env:RUNNER_TEMP "itb-compress-e2e-$([guid]::NewGuid())"
          $cacheDir = Join-Path $env:RUNNER_TEMP "itb-cache-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force -Path $workDir, $cacheDir | Out-Null
          $env:LOCALAPPDATA = $cacheDir
          go run ./scripts/generate-compress-fixtures.go $workDir
          $itb = Join-Path "dist/${{ matrix.target.name }}" "itb.exe"

          $input = Join-Path $workDir "sample.png"
          $output1 = Join-Path $workDir "output1.png"
          $output2 = Join-Path $workDir "output2.png"
          & $itb compress -q 80 $input $output1
          if ($LASTEXITCODE -ne 0) { throw "First PNG compression failed" }
          $before = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -File | Select-Object FullName, Length, LastWriteTimeUtc)
          $beforeDirectories = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -Directory | Select-Object FullName, LastWriteTimeUtc)
          if ($before.Count -ne 2) { throw "Expected two extracted PNG tools, got $($before.Count)" }

          & $itb compress -q 80 $input $output2
          if ($LASTEXITCODE -ne 0) { throw "Second PNG compression failed" }
          $after = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -File | Select-Object FullName, Length, LastWriteTimeUtc)
          $afterDirectories = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -Directory | Select-Object FullName, LastWriteTimeUtc)
          if ((Compare-Object $before $after -Property FullName, Length, LastWriteTimeUtc) -or (Compare-Object $beforeDirectories $afterDirectories -Property FullName, LastWriteTimeUtc)) {
            throw "Second process rewrote the persistent compression cache"
          }

      - name: Resolve WebDAV archive target
        id: archive
        shell: bash
        run: |
          target="${{ matrix.target.name }}"
          echo "target=${target//-/_}" >> "$GITHUB_OUTPUT"

      - name: Package WebDAV archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="release-assets/itb_${{ steps.version.outputs.version }}_${{ steps.archive.outputs.target }}.tar.gz"
          mkdir -p release-assets
          tar -C dist -czf "${archive}" "${{ matrix.target.name }}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Package WebDAV archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "release-assets/itb_${{ steps.version.outputs.version }}_${{ steps.archive.outputs.target }}.zip"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "dist/${{ matrix.target.name }}/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $(Split-Path -Leaf $archive)`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload archive and checksum to WebDAV
        continue-on-error: true
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ steps.version.outputs.version }}"
          files: |
            release-assets/itb_${{ steps.version.outputs.version }}_${{ steps.archive.outputs.target }}.${{ matrix.target.archive_ext }}
            release-assets/itb_${{ steps.version.outputs.version }}_${{ steps.archive.outputs.target }}.${{ matrix.target.archive_ext }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: itb-${{ matrix.target.name }}
          path: dist/${{ matrix.target.name }}/
          if-no-files-found: error

  notify:
    name: Notify Build Result
    runs-on: ubuntu-24.04
    needs: build
    if: always()

    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "${PUSHOVER_TOKEN}" ] || [ -z "${PUSHOVER_USER}" ]; then
            echo "PUSHOVER_TOKEN or PUSHOVER_USER is not configured; skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          <b>ImageToolBox CI 通知</b>
          <u>工作流</u>: <i>${{ github.workflow }}</i>
          <u>构建结果</u>: ${{ needs.build.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.build.result) }}
          <u>分支</u>: <i>${{ github.ref_name }}</i>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <u>提交内容</u>:
          ${COMMIT_MESSAGE:-${PR_TITLE:-workflow_dispatch}}
          EOF
          )
          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=ImageToolBox CI 通知" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
