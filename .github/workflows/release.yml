name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, for example v1.0.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and project
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release tag must match vX.Y.Z: ${tag}"
            exit 2
          fi
          if [[ ! -f go.mod || ! -f main.go ]]; then
            echo "Error: project implementation manifests are missing"
            exit 2
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Validate Homebrew publishing credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Error: HOMEBREW_TAP_TOKEN is required to publish Formula/itb.rb."
            exit 2
          fi

  test:
    name: Release checks
    needs: prepare
    runs-on: ubuntu-24.04

    env:
      ITB_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      ITB_TEST_MINIO_ACCESS_KEY: minioadmin
      ITB_TEST_MINIO_SECRET_KEY: minioadmin
      # strict 模式：MinIO 起不来时集成测试必须失败，不能悄悄 skip
      ITB_REQUIRE_MINIO: "1"

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 不用 service container：GitHub Actions 的 services 不支持容器命令
      # （args 是非法键，会使整个 workflow 在解析阶段失败且不创建任何
      # job；options 又只能传 docker create 的 flags），而 minio/minio
      # 镜像的默认 CMD 只有 "minio"，必须显式传 server /data 才能启动。
      # 在 step 内 docker run 并等待健康检查，启动失败时本 step 直接红。
      - name: Start MinIO
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-06-13T22-53-53Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready (probe $i)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO failed to become healthy"
          docker logs minio
          exit 1

      - name: Run unit checks
        run: |
          make check
          make test-unit

      - name: Run MinIO domain integration tests
        run: go test ./internal/s3 -run '^TestMinIOIntegration$' -v

      - name: Run MinIO CLI end-to-end tests
        run: go test ./internal/s3 -run '^TestMinIOCLIE2E$' -v

  build:
    name: ${{ matrix.target.name }}
    needs: [prepare, test]
    runs-on: ${{ matrix.target.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-amd64
            runs_on: macos-15-intel
            goos: darwin
            goarch: amd64
            bins_dir: bins/macos-amd64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - name: macos-arm64
            runs_on: macos-15
            goos: darwin
            goarch: arm64
            bins_dir: bins/macos-arm64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: linux-amd64
            runs_on: ubuntu-24.04
            goos: linux
            goarch: amd64
            bins_dir: bins/linux-amd64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: ""
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            bins_dir: bins/linux-arm64
            exe_suffix: ""
            archive_ext: tar.gz
            cmake_extra_args: ""
          - name: windows-amd64
            runs_on: windows-2025
            goos: windows
            goarch: amd64
            bins_dir: bins/windows-amd64
            exe_suffix: .exe
            archive_ext: zip
            cmake_extra_args: ""
          - name: windows-arm64
            runs_on: windows-11-arm
            goos: windows
            goarch: arm64
            bins_dir: bins/windows-arm64
            exe_suffix: .exe
            archive_ext: zip
            cmake_extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build bundled compression binaries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/build-linux-bins-container.sh "${{ matrix.target.goarch }}" "${{ matrix.target.bins_dir }}"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install nasm

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command cmake -ErrorAction SilentlyContinue) {
            Write-Host "Using preinstalled CMake:"
            cmake --version
          } else {
            choco install -y cmake
          }

          if (Get-Command nasm -ErrorAction SilentlyContinue) {
            Write-Host "Using preinstalled NASM:"
            nasm -v
          } else {
            choco install -y nasm
          }

      - name: Build pngquant and oxipng (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${{ matrix.target.bins_dir }}"

          git clone --depth 1 --branch 3.0.3 --recursive https://github.com/kornelski/pngquant.git /tmp/pngquant
          pngquant_lock_flag=""
          if [[ -f /tmp/pngquant/Cargo.lock ]]; then
            pngquant_lock_flag="--locked"
          fi
          cargo build --manifest-path /tmp/pngquant/Cargo.toml --release ${pngquant_lock_flag}
          install -m 0755 /tmp/pngquant/target/release/pngquant "${{ matrix.target.bins_dir }}/pngquant"

          git clone --depth 1 --branch v10.1.0 https://github.com/oxipng/oxipng.git /tmp/oxipng
          oxipng_lock_flag=""
          if [[ -f /tmp/oxipng/Cargo.lock ]]; then
            oxipng_lock_flag="--locked"
          fi
          cargo build --manifest-path /tmp/oxipng/Cargo.toml --release ${oxipng_lock_flag}
          install -m 0755 /tmp/oxipng/target/release/oxipng "${{ matrix.target.bins_dir }}/oxipng"

      - name: Build pngquant and oxipng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          New-Item -ItemType Directory -Force -Path $binsDir | Out-Null

          $pngquantDir = Join-Path $env:RUNNER_TEMP "pngquant"
          if (Test-Path $pngquantDir) { Remove-Item -Recurse -Force $pngquantDir }
          git clone --depth 1 --branch 3.0.3 --recursive https://github.com/kornelski/pngquant.git $pngquantDir
          $pngquantArgs = @("build", "--manifest-path", (Join-Path $pngquantDir "Cargo.toml"), "--release")
          if (Test-Path (Join-Path $pngquantDir "Cargo.lock")) { $pngquantArgs += "--locked" }
          cargo @pngquantArgs
          Copy-Item (Join-Path $pngquantDir "target\release\pngquant.exe") (Join-Path $binsDir "pngquant.exe")

          $oxipngDir = Join-Path $env:RUNNER_TEMP "oxipng"
          if (Test-Path $oxipngDir) { Remove-Item -Recurse -Force $oxipngDir }
          git clone --depth 1 --branch v10.1.0 https://github.com/oxipng/oxipng.git $oxipngDir
          $oxipngArgs = @("build", "--manifest-path", (Join-Path $oxipngDir "Cargo.toml"), "--release")
          if (Test-Path (Join-Path $oxipngDir "Cargo.lock")) { $oxipngArgs += "--locked" }
          cargo @oxipngArgs
          Copy-Item (Join-Path $oxipngDir "target\release\oxipng.exe") (Join-Path $binsDir "oxipng.exe")

      - name: Build libjpeg-turbo static tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --branch 3.1.3 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/libjpeg-turbo
          cmake -S /tmp/libjpeg-turbo -B /tmp/libjpeg-turbo/build \
            -DENABLE_SHARED=FALSE \
            -DENABLE_STATIC=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.target.cmake_extra_args }}
          cmake --build /tmp/libjpeg-turbo/build --parallel
          install -m 0755 /tmp/libjpeg-turbo/build/cjpeg-static "${{ matrix.target.bins_dir }}/cjpeg-static"
          install -m 0755 /tmp/libjpeg-turbo/build/djpeg-static "${{ matrix.target.bins_dir }}/djpeg-static"
      - name: Build libjpeg-turbo static tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          $libjpegDir = Join-Path $env:RUNNER_TEMP "libjpeg-turbo"
          $buildDir = Join-Path $libjpegDir "build"
          $cmakeArch = if ("${{ matrix.target.goarch }}" -eq "arm64") { "ARM64" } else { "x64" }

          if (Test-Path $libjpegDir) { Remove-Item -Recurse -Force $libjpegDir }
          git clone --depth 1 --branch 3.1.3 https://github.com/libjpeg-turbo/libjpeg-turbo.git $libjpegDir

          cmake -S $libjpegDir -B $buildDir -A $cmakeArch -DENABLE_SHARED=FALSE -DENABLE_STATIC=TRUE -DCMAKE_BUILD_TYPE=Release
          cmake --build $buildDir --config Release --parallel

          $candidates = @{
            "cjpeg-static.exe" = @(
              (Join-Path $buildDir "Release\cjpeg-static.exe"),
              (Join-Path $buildDir "cjpeg-static.exe")
            )
            "djpeg-static.exe" = @(
              (Join-Path $buildDir "Release\djpeg-static.exe"),
              (Join-Path $buildDir "djpeg-static.exe")
            )
          }

          foreach ($fileName in $candidates.Keys) {
            $source = $null
            foreach ($candidate in $candidates[$fileName]) {
              if (Test-Path $candidate) {
                $source = $candidate
                break
              }
            }

            if (-not $source) {
              throw "Expected libjpeg-turbo artifact not found: $fileName"
            }

            Copy-Item $source (Join-Path $binsDir $fileName)
          }

      - name: Build ZXing reader (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S native/zxing-reader -B "${RUNNER_TEMP}/itb-zxing" \
            -DCMAKE_BUILD_TYPE=Release ${{ matrix.target.cmake_extra_args }}
          cmake --build "${RUNNER_TEMP}/itb-zxing" --config Release --parallel
          cmake --install "${RUNNER_TEMP}/itb-zxing" --component ITBReader --config Release --prefix "${{ matrix.target.bins_dir }}"

      - name: Build ZXing reader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:RUNNER_TEMP "itb-zxing"
          $cmakeArch = if ("${{ matrix.target.goarch }}" -eq "arm64") { "ARM64" } else { "x64" }
          cmake -S native/zxing-reader -B $buildDir -A $cmakeArch
          if ($LASTEXITCODE -ne 0) { throw "ZXing configuration failed" }
          cmake --build $buildDir --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "ZXing build failed" }
          cmake --install $buildDir --config Release --prefix "${{ matrix.target.bins_dir }}"
          if ($LASTEXITCODE -ne 0) { throw "ZXing installation failed" }

      - name: Verify required bundled binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          test -x "${{ matrix.target.bins_dir }}/pngquant"
          test -x "${{ matrix.target.bins_dir }}/oxipng"
          test -x "${{ matrix.target.bins_dir }}/cjpeg-static"
          test -x "${{ matrix.target.bins_dir }}/djpeg-static"
          test -x "${{ matrix.target.bins_dir }}/zxing-reader"

      - name: Verify required bundled binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binsDir = "${{ matrix.target.bins_dir }}"
          $required = @(
            "pngquant.exe",
            "oxipng.exe",
            "cjpeg-static.exe",
            "djpeg-static.exe",
            "zxing-reader.exe"
          )

          foreach ($fileName in $required) {
            $path = Join-Path $binsDir $fileName
            if (-not (Test-Path $path)) {
              throw "Missing bundled binary: $path"
            }
          }

      - name: Verify Linux ABI contract
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-linux-abi.sh "${{ matrix.target.goarch }}" "${{ matrix.target.bins_dir }}"

      - name: Build itb (Unix)
        if: runner.os != 'Windows'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/itb-${{ matrix.target.name }}
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }}" -o dist/itb-${{ matrix.target.name }}/itb .

      - name: Test filesystem contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./internal/imageio

      - name: Build itb (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          $distDir = Join-Path "dist" "itb-${{ matrix.target.name }}"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.prepare.outputs.tag }}" -o (Join-Path $distDir "itb.exe") .

      - name: Verify Linux glibc 2.28 compression compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-linux-compress-e2e.sh "${{ matrix.target.goarch }}" "dist/itb-${{ matrix.target.name }}/itb"

      - name: Verify Windows persistent compression cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $workDir = Join-Path $env:RUNNER_TEMP "itb-compress-e2e-$([guid]::NewGuid())"
          $cacheDir = Join-Path $env:RUNNER_TEMP "itb-cache-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force -Path $workDir, $cacheDir | Out-Null
          $env:LOCALAPPDATA = $cacheDir
          go run ./scripts/generate-compress-fixtures.go $workDir
          $itb = Join-Path "dist/itb-${{ matrix.target.name }}" "itb.exe"

          $input = Join-Path $workDir "sample.png"
          $output1 = Join-Path $workDir "output1.png"
          $output2 = Join-Path $workDir "output2.png"
          & $itb compress -q 80 $input $output1
          if ($LASTEXITCODE -ne 0) { throw "First PNG compression failed" }
          $before = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -File | Select-Object FullName, Length, LastWriteTimeUtc)
          $beforeDirectories = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -Directory | Select-Object FullName, LastWriteTimeUtc)
          if ($before.Count -ne 2) { throw "Expected two extracted PNG tools, got $($before.Count)" }

          & $itb compress -q 80 $input $output2
          if ($LASTEXITCODE -ne 0) { throw "Second PNG compression failed" }
          $after = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -File | Select-Object FullName, Length, LastWriteTimeUtc)
          $afterDirectories = @(Get-ChildItem (Join-Path $cacheDir "itb\bins") -Recurse -Directory | Select-Object FullName, LastWriteTimeUtc)
          if ((Compare-Object $before $after -Property FullName, Length, LastWriteTimeUtc) -or (Compare-Object $beforeDirectories $afterDirectories -Property FullName, LastWriteTimeUtc)) {
            throw "Second process rewrote the persistent compression cache"
          }

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          archive_target="${{ matrix.target.name }}"
          archive_target="${archive_target//-/_}"
          archive="release-assets/itb_${{ needs.prepare.outputs.version }}_${archive_target}.tar.gz"
          tar -C dist -czf "${archive}" "itb-${{ matrix.target.name }}"
          archive_name="$(basename "${archive}")"
          (
            cd release-assets
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${archive_name}" > "${archive_name}.sha256"
            else
              shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
            fi
          )

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $archiveTarget = "${{ matrix.target.name }}".Replace("-", "_")
          $archive = "release-assets/itb_${{ needs.prepare.outputs.version }}_$archiveTarget.zip"
          Compress-Archive -Path "dist/itb-${{ matrix.target.name }}/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          $checksum = "$hash  $(Split-Path -Leaf $archive)`n"
          [System.IO.File]::WriteAllText("$archive.sha256", $checksum, [System.Text.UTF8Encoding]::new($false))

      - name: Resolve WebDAV archive name
        id: archive
        shell: bash
        run: |
          target="${{ matrix.target.name }}"
          echo "target=${target//-/_}" >> "$GITHUB_OUTPUT"

      - name: Upload archive and checksum to WebDAV
        continue-on-error: true
        uses: bxb100/action-upload-webdav@v1
        with:
          webdav_address: ${{ secrets.WEBDAV_SERVER }}
          webdav_username: ${{ secrets.WEBDAV_USERNAME }}
          webdav_password: ${{ secrets.WEBDAV_PASSWORD }}
          webdav_upload_path: "/Shares/github/${{ github.repository }}/${{ needs.prepare.outputs.version }}"
          files: |
            release-assets/itb_${{ needs.prepare.outputs.version }}_${{ steps.archive.outputs.target }}.${{ matrix.target.archive_ext }}
            release-assets/itb_${{ needs.prepare.outputs.version }}_${{ steps.archive.outputs.target }}.${{ matrix.target.archive_ext }}.sha256

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.name }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [prepare, build]

    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          awk -v version="${VERSION}" '
            index($0, "## [v" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "Error: CHANGELOG.md has no release notes for v${VERSION}"
            exit 2
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*

  homebrew:
    name: Publish Homebrew Formula
    needs: [prepare, publish]
    runs-on: macos-latest
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false

    steps:
      - name: Check latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest}" != "${TAG}" ]]; then
            echo "Skip stale release: ${TAG}; latest is ${latest}."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@v5
        with:
          repository: lz-wang/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Read release checksums
        if: steps.release.outputs.publish == 'true'
        id: sha
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          base="https://github.com/lz-wang/image-tool-box/releases/download/${TAG}"
          version="${TAG#v}"
          for target in macos_amd64 macos_arm64 linux_amd64 linux_arm64; do
            file="itb_${version}_${target}.tar.gz.sha256"
            sha="$(curl -fsSL "${base}/${file}" | awk 'NR == 1 { print $1 }')"

            if [[ ! "${sha}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: invalid SHA-256 for ${file}."
              exit 2
            fi

            echo "${target}=${sha}" >> "${GITHUB_OUTPUT}"
          done

      - name: Generate Formula
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_AMD64_SHA: ${{ steps.sha.outputs.macos_amd64 }}
          MACOS_ARM64_SHA: ${{ steps.sha.outputs.macos_arm64 }}
          LINUX_AMD64_SHA: ${{ steps.sha.outputs.linux_amd64 }}
          LINUX_ARM64_SHA: ${{ steps.sha.outputs.linux_arm64 }}
        shell: bash
        run: |
          set -euo pipefail

          cat > homebrew-tap/Formula/itb.rb <<RUBY
          class Itb < Formula
            desc "Image processing command-line toolbox"
            homepage "https://github.com/lz-wang/image-tool-box"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/lz-wang/image-tool-box/releases/download/v${VERSION}/itb_${VERSION}_macos_arm64.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/image-tool-box/releases/download/v${VERSION}/itb_${VERSION}_macos_amd64.tar.gz"
                sha256 "${MACOS_AMD64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/lz-wang/image-tool-box/releases/download/v${VERSION}/itb_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end

              on_intel do
                url "https://github.com/lz-wang/image-tool-box/releases/download/v${VERSION}/itb_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "itb"
            end

            test do
              assert_match "itb version v${VERSION}", shell_output("#{bin}/itb version")
            end
          end
          RUBY

      - name: Commit Formula locally
        if: steps.release.outputs.publish == 'true'
        id: formula
        shell: bash
        run: |
          set -euo pipefail

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git -C homebrew-tap status --porcelain -- Formula/itb.rb)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C homebrew-tap add Formula/itb.rb
          git -C homebrew-tap commit -m "itb ${{ needs.prepare.outputs.version }}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Test Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          brew tap lz-wang/tap "file://${GITHUB_WORKSPACE}/homebrew-tap"
          brew audit --strict --formula lz-wang/tap/itb
          brew install --formula lz-wang/tap/itb
          brew test lz-wang/tap/itb

      - name: Publish Formula
        if: steps.release.outputs.publish == 'true' && steps.formula.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C homebrew-tap push origin HEAD:main

  notify:
    name: Notify Release Result
    runs-on: ubuntu-24.04
    needs: [prepare, test, build, publish, homebrew]
    if: always()

    steps:
      - name: Notify via Pushover
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "${PUSHOVER_TOKEN}" ] || [ -z "${PUSHOVER_USER}" ]; then
            echo "PUSHOVER_TOKEN or PUSHOVER_USER is not configured; skipping notification."
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          <b>ImageToolBox Release 通知</b>
          <u>工作流</u>: <i>${{ github.workflow }}</i>
          <u>校验结果</u>: ${{ needs.prepare.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.prepare.result) }}
          <u>测试结果</u>: ${{ needs.test.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.test.result) }}
          <u>构建结果</u>: ${{ needs.build.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.build.result) }}
          <u>发布结果</u>: ${{ needs.publish.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.publish.result) }}
          <u>Homebrew</u>: ${{ needs.homebrew.result == 'success' && '<font color="#00aa00"><b>success</b></font>' || format('<font color="#cc0000"><b>{0}</b></font>', needs.homebrew.result) }}
          <u>版本</u>: <font color="#0000ff">${RELEASE_TAG}</font>
          <u>分支/标签</u>: <i>${{ github.ref_name }}</i>
          <u>触发人</u>: <i>${{ github.actor }}</i>
          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">查看运行详情</a>
          <u>提交内容</u>:
          ${COMMIT_MESSAGE:-${PR_TITLE:-${MANUAL_TAG:-workflow_dispatch}}}
          EOF
          )
          curl -fsS https://api.pushover.net/1/messages.json \
            --data-urlencode "token=${PUSHOVER_TOKEN}" \
            --data-urlencode "user=${PUSHOVER_USER}" \
            --data-urlencode "title=ImageToolBox Release 通知" \
            --data-urlencode "html=1" \
            --data-urlencode "message=${MESSAGE}"
